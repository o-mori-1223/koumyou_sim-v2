<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分光データ（波長/反射率）カラービジュアライザー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #333;
            line-height: 1.6;
        }
        h1 { font-size: 1.5rem; border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
        .card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input[type="file"] { margin-bottom: 10px; }
        .result-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .color-box {
            width: 120px;
            height: 120px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .info p { margin: 5px 0; font-family: monospace; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f1f1f1; }
    </style>
</head>
<body>

    <h1>分光データから色への変換アプリ</h1>
    
    <div class="card">
        <h3>1. CSVファイルの選択</h3>
        <p>1列目に「波長 (nm)」、2列目に「反射率 (0〜1 または 0〜100)」が入ったCSVファイルをアップロードしてください。（ヘッダー行有無は自動判定またはスキップします）</p>
        <input type="file" id="csvFile" accept=".csv, .txt">
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <h3>2. 変換結果（CIE D65光源 / 2° 視野）</h3>
        <div class="result-container">
            <div class="color-box" id="colorBox"></div>
            <div class="info" id="colorInfo">
                <!-- 結果がここに入ります -->
            </div>
        </div>
        
        <h4>読み込んだデータ（プレビュー）</h4>
        <div style="max-height: 150px; overflow-y: auto;">
            <table id="previewTable">
                <thead><tr><th>波長 (nm)</th><th>反射率</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // CIE 1931 2° 標準観測者 等色関数 (380nm - 780nm, 5nm刻み, CIE標準値)
        // Gsolver'S COLOR.html と同一データソースに統一済み（以前の10nm簡易版はz-barに
        // 440-580nm付近で最大8倍程度の誤差があり、2ツール間で色がずれる原因になっていた）
        const CIE_XYZ = [
            [380, 0.001368, 3.9e-05, 0.00645], [385, 0.002236, 6.4e-05, 0.01054999], [390, 0.004243, 0.00012, 0.02005001],
            [395, 0.00765, 0.000217, 0.03621], [400, 0.01431, 0.000396, 0.06785001], [405, 0.02319, 0.00064, 0.1102],
            [410, 0.04351, 0.00121, 0.2074], [415, 0.07763, 0.00218, 0.3713], [420, 0.13438, 0.004, 0.6456],
            [425, 0.21477, 0.0073, 1.0390501], [430, 0.2839, 0.0116, 1.3856], [435, 0.3285, 0.01684, 1.62296],
            [440, 0.34828, 0.023, 1.74706], [445, 0.34806, 0.0298, 1.7826], [450, 0.3362, 0.038, 1.77211],
            [455, 0.3187, 0.048, 1.7441], [460, 0.2908, 0.06, 1.6692], [465, 0.2511, 0.0739, 1.5281],
            [470, 0.19536, 0.09098, 1.28764], [475, 0.1421, 0.1126, 1.0419], [480, 0.09564, 0.13902, 0.8129501],
            [485, 0.05795001, 0.1693, 0.6162], [490, 0.03201, 0.20802, 0.46518], [495, 0.0147, 0.2586, 0.3533],
            [500, 0.0049, 0.323, 0.272], [505, 0.0024, 0.4073, 0.2123], [510, 0.0093, 0.503, 0.1582],
            [515, 0.0291, 0.6082, 0.1117], [520, 0.06327, 0.71, 0.07824999], [525, 0.1096, 0.7932, 0.05725001],
            [530, 0.1655, 0.862, 0.04216], [535, 0.2257499, 0.9148501, 0.02984], [540, 0.2904, 0.954, 0.0203],
            [545, 0.3597, 0.9803, 0.0134], [550, 0.4334499, 0.9949501, 0.00875], [555, 0.5120501, 1.0, 0.00575],
            [560, 0.5945, 0.995, 0.0039], [565, 0.6784, 0.9786, 0.00275], [570, 0.7621, 0.952, 0.0021],
            [575, 0.8425, 0.9154, 0.0018], [580, 0.9163, 0.87, 0.00165], [585, 0.9786, 0.8163, 0.0014],
            [590, 1.0263, 0.757, 0.0011], [595, 1.0567, 0.6949, 0.001], [600, 1.0622, 0.631, 0.0008],
            [605, 1.0456, 0.5668, 0.0006], [610, 1.0026, 0.503, 0.00034], [615, 0.9384, 0.4412, 0.00024],
            [620, 0.8544499, 0.381, 0.00019], [625, 0.7514, 0.321, 0.0001], [630, 0.6424, 0.265, 5e-05],
            [635, 0.5419, 0.217, 3e-05], [640, 0.4479, 0.175, 2e-05], [645, 0.3608, 0.1382, 1e-05],
            [650, 0.2835, 0.107, 0.0], [655, 0.2187, 0.0816, 0.0], [660, 0.1649, 0.061, 0.0],
            [665, 0.1212, 0.04458, 0.0], [670, 0.0874, 0.032, 0.0], [675, 0.0636, 0.0232, 0.0],
            [680, 0.04677, 0.017, 0.0], [685, 0.0329, 0.01192, 0.0], [690, 0.0227, 0.00821, 0.0],
            [695, 0.01584, 0.005723, 0.0], [700, 0.01135916, 0.004102, 0.0], [705, 0.00811092, 0.002929, 0.0],
            [710, 0.00579035, 0.002091, 0.0], [715, 0.00410946, 0.001484, 0.0], [720, 0.00289933, 0.001047, 0.0],
            [725, 0.00204919, 0.00074, 0.0], [730, 0.00143997, 0.00052, 0.0], [735, 0.00099995, 0.0003611, 0.0],
            [740, 0.00069008, 0.0002492, 0.0], [745, 0.00047602, 0.0001719, 0.0], [750, 0.0003323, 0.00012, 0.0],
            [755, 0.00023483, 8.48e-05, 0.0], [760, 0.00016615, 6e-05, 0.0], [765, 0.00011741, 4.24e-05, 0.0],
            [770, 8.308e-05, 3e-05, 0.0], [775, 5.871e-05, 2.12e-05, 0.0], [780, 4.151e-05, 1.499e-05, 0.0]
        ];

        // 標準光D65の相対分光分布 (CIE標準値, 5nm刻み)
        const D65 = {
            380: 49.9755, 385: 52.3118, 390: 54.6482, 395: 68.7015, 400: 82.7549, 405: 87.1204,
            410: 91.486, 415: 92.4589, 420: 93.4318, 425: 90.057, 430: 86.6823, 435: 95.7736,
            440: 104.865, 445: 110.936, 450: 117.008, 455: 117.41, 460: 117.812, 465: 116.336,
            470: 114.861, 475: 115.392, 480: 115.923, 485: 112.367, 490: 108.811, 495: 109.082,
            500: 109.354, 505: 108.578, 510: 107.802, 515: 106.296, 520: 104.79, 525: 106.239,
            530: 107.689, 535: 106.047, 540: 104.405, 545: 104.225, 550: 104.046, 555: 102.023,
            560: 100.0, 565: 98.1671, 570: 96.3342, 575: 96.0611, 580: 95.788, 585: 92.2368,
            590: 88.6856, 595: 89.3459, 600: 90.0062, 605: 89.8026, 610: 89.5991, 615: 88.6489,
            620: 87.6987, 625: 85.4936, 630: 83.2886, 635: 83.4939, 640: 83.6992, 645: 81.863,
            650: 80.0268, 655: 80.1207, 660: 80.2146, 665: 81.2462, 670: 82.2778, 675: 80.281,
            680: 78.2842, 685: 74.0027, 690: 69.7213, 695: 70.6652, 700: 71.6091, 705: 72.979,
            710: 74.349, 715: 67.9765, 720: 61.604, 725: 65.7448, 730: 69.8856, 735: 72.4863,
            740: 75.087, 745: 69.3398, 750: 63.5927, 755: 55.0054, 760: 46.4182, 765: 56.6118,
            770: 66.8054, 775: 65.0941, 780: 63.3828
        };

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                parseCSVAndCompute(event.target.result);
            };
            reader.readAsText(file);
        });

        function parseCSVAndCompute(text) {
            const lines = text.split(/\r\n|\n/);
            const dataMap = new Map();

            for (let line of lines) {
                if (!line.trim()) continue;
                const cols = line.split(',').map(c => c.trim());
                const w = parseFloat(cols[0]);
                const r = parseFloat(cols[1]);
                if (!isNaN(w) && !isNaN(r)) {
                    // 反射率が 0〜100 の場合は 0〜1 に正規化
                    dataMap.set(w, r > 1.0 ? r / 100.0 : r);
                }
            }

            if (dataMap.size === 0) {
                alert('有効な波長・反射率データが見つかりませんでした。');
                return;
            }

            // 三刺激値 X, Y, Z の計算
            let X = 0, Y = 0, Z = 0, Y_sum = 0;
            
            for (let item of CIE_XYZ) {
                const [lambda, xBar, yBar, zBar] = item;
                // dataMap.get(lambda) は反射率が正確に0のとき falsy になるため、
                // "||" ではなく has() で存在チェックする（0を誤って補間値に置き換えないため）
                const reflectance = dataMap.has(lambda) ? dataMap.get(lambda) : interpolate(dataMap, lambda);
                const d65Energy = D65[lambda] || 100;

                X += reflectance * xBar * d65Energy;
                Y += reflectance * yBar * d65Energy;
                Z += reflectance * zBar * d65Energy;
                Y_sum += yBar * d65Energy; // 完全反射面(R=1)のY
            }

            // 正規化
            const k = 100 / Y_sum;
            X *= k; Y *= k; Z *= k;

            // XYZ から sRGB への変換
            const rgb = xyzToSrgb(X, Y, Z);

            // 画面表示更新
            updateUI(X, Y, Z, rgb, dataMap);
        }

        function interpolate(map, lambda) {
            // 単純な線形補間（必要に応じ）
            const keys = Array.from(map.keys()).sort((a,b)=>a-b);
            let lower = keys[0], upper = keys[keys.length-1];
            for (let k of keys) {
                if (k <= lambda) lower = k;
                if (k >= lambda) { upper = k; break; }
            }
            if (lower === upper) return map.has(lower) ? map.get(lower) : 0;
            const v1 = map.get(lower), v2 = map.get(upper);
            return v1 + (v2 - v1) * (lambda - lower) / (upper - lower);
        }

        function xyzToSrgb(x, y, z) {
            let xr = x / 100, yr = y / 100, zr = z / 100;

            // CIE XYZ to Linear sRGB
            let r =  3.2406 * xr - 1.5372 * yr - 0.4986 * zr;
            let g = -0.9689 * xr + 1.8758 * yr + 0.0415 * zr;
            let b =  0.0557 * xr - 0.2040 * yr + 1.0570 * zr;

            // Gamma correction (sRGB)
            const gamma = val => {
                val = Math.max(0, Math.min(1, val));
                return val <= 0.0031308 ? 12.92 * val : 1.055 * Math.pow(val, 1.0 / 2.4) - 0.055;
            };

            return {
                r: Math.round(gamma(r) * 255),
                g: Math.round(gamma(g) * 255),
                b: Math.round(gamma(b) * 255)
            };
        }

        function updateUI(X, Y, Z, rgb, dataMap) {
            document.getElementById('resultCard').style.display = 'block';
            
            // 色ボックス
            const rgbStr = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
            document.getElementById('colorBox').style.backgroundColor = rgbStr;

            // 情報テキスト
            document.getElementById('colorInfo').innerHTML = `
                <p><strong>sRGB:</strong> (${rgb.r}, ${rgb.g}, ${rgb.b})</p>
                <p><strong>HEX:</strong> #${((1 << 24) + (rgb.r << 16) + (rgb.g << 8) + rgb.b).toString(16).slice(1).toUpperCase()}</p>
                <p><strong>XYZ:</strong> X=${X.toFixed(2)}, Y=${Y.toFixed(2)}, Z=${Z.toFixed(2)}</p>
            `;

            // テーブルプレビュー
            const tbody = document.querySelector('#previewTable tbody');
            tbody.innerHTML = '';
            let count = 0;
            for (let [w, r] of dataMap.entries()) {
                if (count < 50) { // 最大50行まで表示
                    const row = `<tr><td>${w}</td><td>${r.toFixed(4)}</td></tr>`;
                    tbody.innerHTML += row;
                }
                count++;
            }
        }
    </script>
</body>
</html>
