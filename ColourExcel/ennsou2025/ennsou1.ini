import cv2
import numpy as np
import matplotlib.pyplot as plt
from matplotlib.lines import Line2D # 凡例作成用

def plot_rgb_contours(image_path, levels=5):
    """
    画像を読み込み、RGB各チャンネルの強度に基づいた等高線を描画する。

    Args:
        image_path (str): 入力画像のファイルパス。
        levels (int or list): 
            等高線のレベル数 (int) または 
            等高線を引く具体的な強度値のリスト (list, 例: [50, 100, 150])。
    """
    
    # 1. 画像の読み込み
    # OpenCVはデフォルトでBGR (青, 緑, 赤) の順で読み込みます
    img_bgr = cv2.imread(image_path)

    if img_bgr is None:
        print(f"❌ エラー: 画像ファイル '{image_path}' を読み込めません。")
        print("ファイルパスが正しいか、ファイルが存在するか確認してください。")
        # デモ用にダミーデータを生成します
        print("代わりにダミーのグラデーション画像でデモを行います。")
        H, W = 300, 400
        y_ramp = np.linspace(0, 255, H).reshape(-1, 1)
        x_ramp = np.linspace(0, 255, W).reshape(1, -1)
        
        # R: 左から右へ, G: 上から下へ, B: 中心から
        R = np.tile(x_ramp, (H, 1))
        G = np.tile(y_ramp, (H, 1))
        
        center_y, center_x = H // 2, W // 2
        Y_coords, X_coords = np.indices((H, W))
        dist = np.sqrt((Y_coords - center_y)**2 + (X_coords - center_x)**2)
        max_dist = np.sqrt(center_y**2 + center_x**2)
        B = 255 - np.clip((dist / max_dist) * 255, 0, 255) # 中心を明るく
        
        img_rgb = np.stack([R, G, B], axis=-1).astype(np.uint8)
    else:
        # 2. BGRからRGBに変換
        # Matplotlibで正しく表示するためにRGBの順序に変換します
        img_rgb = cv2.cvtColor(img_bgr, cv2.COLOR_BGR2RGB)

    # 3. 画像の高さ(H)と幅(W)を取得
    H, W = img_rgb.shape[:2]

    # 4. R, G, B チャンネルに分離
    # img_rgb[:, :, 0] が 赤(R)
    # img_rgb[:, :, 1] が 緑(G)
    # img_rgb[:, :, 2] が 青(B)
    R, G, B = img_rgb[:, :, 0], img_rgb[:, :, 1], img_rgb[:, :, 2]

    # 5. 等高線プロット用のX, Y座標グリッドを作成
    x = np.arange(0, W, 1)
    y = np.arange(0, H, 1)
    X, Y = np.meshgrid(x, y)

    # 6. 等高線の描画
    print(f"🎨 '{image_path}' (またはダミー画像) のRGB等高線を描画します...")
    
    plt.figure(figsize=(12, 9))
    
    # 6-1. 元の画像を背景として表示
    plt.imshow(img_rgb, extent=[0, W, H, 0]) # extentで座標を合わせ、H, 0でY軸を反転
    
    # 6-2. 等高線の設定
    contour_alpha = 0.8 # 透明度
    contour_linewidth = 1.5 # 線の太さ

    # 赤 (R) チャンネルの等高線 (実線)
    plt.contour(X, Y, R, levels=levels, colors='red', 
                alpha=contour_alpha, linewidths=contour_linewidth, 
                linestyles='solid')

    # 緑 (G) チャンネルの等高線 (破線)
    plt.contour(X, Y, G, levels=levels, colors='lime', # 'green'より明るい'lime'を使用
                alpha=contour_alpha, linewidths=contour_linewidth,
                linestyles='dashed')

    # 青 (B) チャンネルの等高線 (点線)
    plt.contour(X, Y, B, levels=levels, colors='blue', 
                alpha=contour_alpha, linewidths=contour_linewidth,
                linestyles='dotted')

    # 7. グラフの装飾
    plt.title(f'RGB Channel Contours (Levels={levels})\n(R: solid, G: dashed, B: dotted)')
    plt.xlabel('Width (pixels)')
    plt.ylabel('Height (pixels)')
    
    # 凡例 (どの線がどのチャンネルかを示す)
    legend_elements = [
        Line2D([0], [0], color='red', lw=contour_linewidth, linestyle='solid', label='Red Channel'),
        Line2D([0], [0], color='lime', lw=contour_linewidth, linestyle='dashed', label='Green Channel'),
        Line2D([0], [0], color='blue', lw=contour_linewidth, linestyle='dotted', label='Blue Channel')
    ]
    plt.legend(handles=legend_elements, loc='best', facecolor='white', framealpha=0.7)

    plt.axis('on') # 軸を強制的に表示
    plt.gca().set_aspect('equal') # アスペクト比を画像と合わせる
    plt.tight_layout() # レイアウトを自動調整

    # 8. 結果の表示
    plt.show()

