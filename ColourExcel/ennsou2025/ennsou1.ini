    # 例: 50, 100, 150, 200, 250 の位置に線を引く
    # plot_rgb_contours(image_file_path, levels=[50, 100, 150, 200, 250])

    # --- 実行例 3: 存在しないパス (デモ用) ---
    # image_file_path を書き換えない場合、ダミー画像で実行されます
    plot_rgb_contours(image_file_path, levels=6)